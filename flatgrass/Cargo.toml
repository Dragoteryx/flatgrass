[package]
name = "flatgrass"
version = "0.1.0"
edition = "2024"
readme = "README.md"

[lib]
doctest = false

[features]
default = ["macros"]
either = ["dep:either"]
macros = ["dep:flatgrass-macros"]
serde = ["dep:serde", "either?/serde"]
async = ["flatgrass-macros?/async", "dep:avenir"]
tokio = ["async", "dep:tokio", "dep:async-channel"]

[dependencies.flatgrass-ffi]
path = "../flatgrass-ffi"

[dependencies.flatgrass-macros]
path = "../flatgrass-macros"
optional = true

[dependencies.either]
version = "1"
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.avenir]
git = "https://github.com/Dragoteryx/avenir.git"
optional = true

[dependencies.async-channel]
version = "2"
optional = true

[dependencies.tokio]
version = "1"
default-features = false
features = ["rt"]
optional = true

[build-dependencies]
rustc_version = "0.4"

[package.metadata.docs.rs]
all-features = true
