[package]
name = "flatgrass"
version = "0.1.0"
edition = "2024"
readme = "README.md"

[lib]
doctest = false

[features]
default = ["macros"]
either = ["dep:either"]
macros = ["dep:flatgrass-macros"]
serde = ["dep:serde", "either?/serde"]
tokio = ["async", "dep:tokio"]
async = [
	"flatgrass-macros?/async",
	"dep:futures-channel",
	"dep:avenir"
]

[dependencies.flatgrass-ffi]
path = "../flatgrass-ffi"

[dependencies.flatgrass-macros]
path = "../flatgrass-macros"
optional = true

[dependencies.either]
default-features = false
optional = true
version = "1"

[dependencies.serde]
default-features = false
features = ["derive"]
optional = true
version = "1"

[dependencies.avenir]
git = "https://github.com/Dragoteryx/avenir.git"
optional = true

[dependencies.futures-channel]
default-features = false
features = ["alloc"]
optional = true
version = "0.3"

[dependencies.tokio]
default-features = false
features = ["rt"]
optional = true
version = "1"



[build-dependencies]
rustc_version = "0.4"

[package.metadata.docs.rs]
all-features = true
